# PRs are squash-merged using the PR title as the commit message, so the
# title must be a Conventional Commit header. Types match CLAUDE.md and
# .githooks/commit-msg.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            style
            refactor
            docs
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >
            The description "{subject}" in "{title}" should start lowercase and
            not end with a period, e.g. "content(about): shorten the intro".
